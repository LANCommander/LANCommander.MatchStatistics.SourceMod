// LANCommander Match Statistics: game events to record, for games without a
// module of their own (lancommander_stats_<game>.smx).
//
// The core plugin already records, for every game, the events most Source
// games share: player_death (kill), player_hurt (damage), player_spawn,
// player_team, player_changename, player_disconnect, weapon_fire, round_start
// and round_end. List anything else here.
//
// Sections are game folder names (cstrike, tf, dod, nmrih, ...), or "*" for
// every game. Inside, one block per game event:
//
//   "<game event name>"
//   {
//       "type"          "zombie_killed"   // the match event recorded; default: the game event's name
//       "actor"         "killeridx"       // field naming the player who did it (optional)
//       "actor_kind"    "client"          // "userid" (the default) or "client" (an index)
//       "subject"       ""                // field naming the player it happened to (optional)
//       "subject_kind"  "userid"
//       "actor_stat"    "zombie_kills"    // statistic added to the actor, +1 each time (optional)
//       "subject_stat"  ""                // and to the subject (optional)
//       "fields"                          // copied into the event's payload (optional)
//       {
//           "<field>"   "int"             // int, float, bool, string, userid or client
//       }                                 //   (userid/client fields become player keys)
//   }
//
// A game event the game does not have is skipped, with a line in the
// SourceMod log. Event names and fields come from the game's
// resource/modevents.res; check them there, since a wrong field reads as 0.
// The file is read once, when the plugin loads.

"LANCommanderEvents"
{
    "*"
    {
    }

    // No More Room in Hell. Event names and fields as NMRiH plugins use them;
    // check against your server's modevents.res.
    "nmrih"
    {
        "npc_killed"
        {
            "type"          "zombie_killed"
            "actor"         "killeridx"
            "actor_kind"    "client"
            "actor_stat"    "zombie_kills"
            "fields"
            {
                "weaponid"  "int"
                "isturned"  "bool"
            }
        }

        "player_extracted"
        {
            "type"          "extracted"
            "actor"         "player_id"
            "actor_kind"    "client"
            "actor_stat"    "extractions"
        }

        "objective_complete"
        {
            "type"          "objective_complete"
            "fields"
            {
                "id"        "int"
                "name"      "string"
            }
        }

        "extraction_begin"
        {
            "type"          "extraction_begin"
        }
    }
}
