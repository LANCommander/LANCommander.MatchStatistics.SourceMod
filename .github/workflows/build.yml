name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  SOURCEMOD_BRANCH: '1.12'

jobs:
  # The extension, Windows x86 and x64.
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [windows-x86, windows-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The presets take vcpkg from VCPKG_ROOT; the runner ships a clone. The
      # overlay triplets in triplets/ pin the v143 toolset the presets use.
      - name: Locate vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append'

      # The Interposer's CMake requires YY-Thunks to configure, even though the
      # extension does not link it (srcds needs nothing from Windows XP).
      - name: Fetch YY-Thunks
        shell: pwsh
        working-directory: external/LANCommander.Interposer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Get-YYThunks.ps1

      - name: Build
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}-release

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}-release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: out/${{ matrix.preset }}/bin/Release/lancommander.ext.dll

  # The Interposer's build image (Debian 12, multilib, pinned vcpkg), cached in
  # GHCR under a hash of its docker/ directory. It is built and pushed only when
  # that tag is missing, i.e. when the Dockerfile changes with the submodule.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Interposer
        run: git submodule update --init --depth 1 external/LANCommander.Interposer

      - name: Image reference
        id: ref
        run: |
          hash=$(cd external/LANCommander.Interposer/docker &&
            find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/build:$hash" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Retried: bootstrap-vcpkg.sh downloads the vcpkg binary from GitHub
      # releases, which sometimes answers 504 for a minute or two. A pull
      # request from a fork can't push; the linux job builds the image itself
      # then.
      - name: Build and push if missing
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "$REF is cached"; exit 0
          fi
          for attempt in 1 2 3; do
            if docker build -f external/LANCommander.Interposer/docker/build.Dockerfile -t "$REF" \
                --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                external/LANCommander.Interposer/docker; then
              docker push "$REF"; exit $?
            fi
            echo "::warning::docker build failed (attempt $attempt), retrying"
            sleep $((attempt * 30))
          done
          exit 1

  # The extension, Linux x86 and x64, in the build image, so it runs on the
  # glibc of LANCommander's server images.
  linux:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        preset: [linux-x86, linux-x64]
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull image
        run: |
          docker pull "$IMAGE" || docker build -f external/LANCommander.Interposer/docker/build.Dockerfile \
            -t "$IMAGE" external/LANCommander.Interposer/docker

      - name: Build and test
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" sh -c '
            cmake --preset ${{ matrix.preset }} &&
            cmake --build --preset ${{ matrix.preset }}-release &&
            ctest --preset ${{ matrix.preset }}-release'

      # Only GetSMExtAPI and the Interposer's API may be exported (exports.map).
      - name: Check exports
        run: |
          unexpected=$(nm -D --defined-only out/${{ matrix.preset }}/bin/Release/lancommander.ext.so |
            awk '{print $3}' | grep -vE '^(GetSMExtAPI|Interposer.*|interposer_comms_.*)$' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected exports:"; echo "$unexpected"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: out/${{ matrix.preset }}/bin/Release/lancommander.ext.so

  # Every plugin, with SourceMod's compiler, warnings as errors.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SourceMod
        run: |
          name=$(curl -sSf "https://sm.alliedmods.net/smdrop/$SOURCEMOD_BRANCH/sourcemod-latest-linux")
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl -sSf "https://sm.alliedmods.net/smdrop/$SOURCEMOD_BRANCH/$name" | tar -xz -C "$RUNNER_TEMP/sourcemod"

      - name: Compile
        run: SPCOMP="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting/spcomp64" bash scripting/compile.sh out/plugins

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/plugins/*.smx

  package:
    needs: [windows, linux, plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release, on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: bash scripting/package.sh artifacts artifacts/plugins package

      - uses: actions/upload-artifact@v4
        with:
          name: LANCommander.SourceMod.MatchStatistics
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd package && zip -r "../LANCommander.SourceMod.MatchStatistics-${GITHUB_REF_NAME}.zip" .)
          gh release create "$GITHUB_REF_NAME" "LANCommander.SourceMod.MatchStatistics-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
